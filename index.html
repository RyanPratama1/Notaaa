.pill:hover{background:rgba(255,255,255,.14)}.pill.on{background:#fff;color:#0f172a;border-color:#fff}

.act button:hover{background:rgba(255,255,255,.12)}
.home{max-width:1100px;margin:0 auto;padding:44px 20px 60px}

.last{margin-top:20px;display:inline-flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;transition:transform .18s,box-shadow .18s;position:relative}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 18px 40px -16px rgba(0,0,0,.35);outline:0}
.top{height:150px;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}
.mini{width:84px;background:#fff;border-radius:3px 3px 0 0;padding:9px 8px 14px;display:grid;gap:5px;transform:rotate(-3deg);box-shadow:0 8px 20px rgba(0,0,0,.3);-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/9px 100% repeat-x;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/9px 100% repeat-x;padding-bottom:16px}
.mini b{height:5px;border-radius:2px;background:#d6d3d1;display:block}.mini b.h{background:var(--c);height:7px}.mini b.c{margin-inline:auto}
.num{position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
.new{position:absolute;right:12px;top:12px;background:#fff;color:#111;font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.04em}
.body{padding:16px 18px 18px}.body h3{margin:0 0 4px;font-size:17px}.body p{margin:0 0 12px;font-size:13px;color:var(--mute);line-height:1.5}

@media(prefers-color-scheme:dark){.tags span{color:color-mix(in srgb,var(--c) 50%,#fff)}}
.foot{margin-top:36px;color:var(--mute);font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding-top:18px}
.stage{height:calc(100vh - 56px)}.stage iframe{width:100%;height:100%;border:0;background:#fff;display:none}
